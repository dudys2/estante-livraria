# Estante: front (React) + back (PHP) + MySQL, atrás de um proxy reverso Nginx.
# Uso: copie .env.example para .env, preencha e rode `docker compose up --build`.
# Só o "gateway" (Nginx) publica porta no computador; os outros serviços ficam na rede interna.

services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${PORTA_WEB:-8080}:80"
    volumes:
      - ./docker/gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks: [rede_estante]
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    networks: [rede_estante]
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    environment:
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
      DB_HOST: banco
      DB_PORTA: "3306"
      DB_NOME: biblioteca
      DB_USUARIO: estante
      DB_SENHA: ${DB_SENHA:?Defina DB_SENHA no .env}
    depends_on:
      banco:
        condition: service_healthy
    networks: [rede_estante]
    restart: unless-stopped

  banco:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_SENHA:?Defina DB_ROOT_SENHA no .env}
      MYSQL_DATABASE: biblioteca
      MYSQL_USER: estante
      MYSQL_PASSWORD: ${DB_SENHA:?Defina DB_SENHA no .env}
    volumes:
      - dados_mysql:/var/lib/mysql
      # Scripts rodam em ordem alfabética, só na primeira vez (volume vazio).
      - ./livraria/database/complementar_biblioteca.sql:/docker-entrypoint-initdb.d/01-complementar_biblioteca.sql:ro
      - ./livraria/database/usuarios_cadastro_mysql8.sql:/docker-entrypoint-initdb.d/02-usuarios_cadastro.sql:ro
      - ./livraria/database/dados_exemplo.sql:/docker-entrypoint-initdb.d/03-dados_exemplo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [rede_estante]
    restart: unless-stopped

networks:
  rede_estante:
    driver: bridge

volumes:
  dados_mysql:
